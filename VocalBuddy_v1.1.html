<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0e14" />
  <title>VocalBuddy v1.1 — 歌手音准与风格练声器</title>
  <script>
    (function setupPWA() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="40" fill="#141923"/><circle cx="90" cy="72" r="24" fill="none" stroke="#38bdf8" stroke-width="10"/><path d="M56 76a34 34 0 0 0 68 0" fill="none" stroke="#a78bfa" stroke-width="10" stroke-linecap="round"/><line x1="90" y1="110" x2="90" y2="140" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/><line x1="68" y1="140" x2="112" y2="140" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/></svg>`;
      const iconUrl = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svgIcon);
      const appleLink = document.createElement("link");
      appleLink.rel = "apple-touch-icon";
      appleLink.href = iconUrl;
      document.head.appendChild(appleLink);
    })();
  </script>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #141923;
      --card-2: #1c2230;
      --border: #2a3346;
      --text: #eef2ff;
      --muted: #8f9bb3;
      --accent: #38bdf8;
      --green: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --purple: #a78bfa;
      --pink: #f472b6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      min-height: 100%;
    }

    body {
      padding: 14px 14px 104px 14px;
      max-width: 580px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .title-wrap {
      min-width: 0;
      flex: 1;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    .title-wrap p {
      margin: 2px 0 0;
      font-size: 11px;
      color: var(--muted);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .chip-btn {
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--border);
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip-btn.mic-on {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border-color: rgba(34, 197, 94, 0.45);
    }

    .chip-btn.mic-off {
      background: rgba(245, 158, 11, 0.14);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.35);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
    }

    .card-sub {
      font-size: 12px;
      color: var(--muted);
    }

    /* 实时音高监测面板 */
    .pitch-readout-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .note-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .detected-note {
      font-size: 34px;
      font-weight: 900;
      line-height: 1;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      min-width: 68px;
    }

    .detected-note.in-tune {
      color: var(--green);
    }

    .cents-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .target-pill {
      padding: 5px 10px;
      border-radius: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 700;
      color: var(--purple);
    }

    .cents-meter {
      position: relative;
      height: 10px;
      border-radius: 999px;
      background: var(--card-2);
      border: 1px solid var(--border);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .cents-center-zone {
      position: absolute;
      left: 42%;
      width: 16%;
      top: 0;
      bottom: 0;
      background: rgba(34, 197, 94, 0.25);
    }

    .cents-needle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      margin-left: -3px;
      border-radius: 3px;
      background: var(--accent);
      left: 50%;
      transition: left 0.06s linear, background 0.1s ease;
    }

    .pitch-canvas {
      width: 100%;
      height: 132px;
      border-radius: 12px;
      background: #0e131c;
      border: 1px solid var(--border);
      display: block;
    }

    /* 男女声切换 */
    .voice-switch-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    .voice-btn {
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .voice-btn small {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .voice-btn.active-male {
      background: rgba(56, 189, 248, 0.18);
      border-color: var(--accent);
      color: #7dd3fc;
    }

    .voice-btn.active-female {
      background: rgba(244, 114, 182, 0.18);
      border-color: var(--pink);
      color: #f9a8d4;
    }

    .mini-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mini-grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mini-field label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .mini-field select, .mini-field input {
      width: 100%;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 13px;
    }

    /* 风格标签与模进选择 */
    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      padding: 7px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--accent);
      color: #061018;
      border-color: var(--accent);
    }

    .pill-btn.jpop.active {
      background: #38bdf8;
      border-color: #38bdf8;
      color: #061018;
    }

    .pill-btn.jrock.active {
      background: #fb923c;
      border-color: #fb923c;
      color: #160a02;
    }

    .pill-btn.jjazz.active {
      background: #a78bfa;
      border-color: #a78bfa;
      color: #0e071c;
    }

    /* 音符步进条 */
    .notes-strip {
      display: flex;
      gap: 5px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .note-step {
      flex: 1;
      min-width: 34px;
      padding: 8px 3px;
      border-radius: 10px;
      background: var(--card-2);
      border: 1px solid var(--border);
      text-align: center;
      transition: transform 0.06s ease, background 0.06s ease, border-color 0.06s ease;
    }

    .note-step .deg {
      font-size: 13px;
      font-weight: 800;
      color: var(--text);
    }

    .note-step .n-name {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .note-step.active {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .note-step.active .deg {
      color: #fff;
    }

    .pattern-desc {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .bpm-row {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }

    .step-btn {
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      height: 24px;
    }

    .dock-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(11, 14, 20, 0.94);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      max-width: 580px;
      margin: 0 auto;
      z-index: 50;
    }

    .play-btn {
      flex: 1;
      height: 48px;
      border-radius: 13px;
      border: none;
      background: var(--green);
      color: #05140a;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .play-btn.playing {
      background: var(--danger);
      color: #fff;
    }

    .shift-btn {
      width: 64px;
      height: 48px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .shift-btn:active {
      background: #283147;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title-wrap">
      <h1 id="appTitle">VocalBuddy v1.1</h1>
      <p id="appSubtitle">J-Pop / J-Rock / J-Jazz 旋律练声 · 实时音准曲线</p>
    </div>
    <div class="top-actions">
      <button id="langBtn" class="chip-btn" type="button">EN</button>
      <button id="micToggleBtn" class="chip-btn mic-off" type="button">麦克风：请求中</button>
    </div>
  </div>

  <!-- 实时音准监测 & 音高轨迹 -->
  <div class="card">
    <div class="card-header">
      <span id="pitchCardTitle" class="card-title">实时音高与音准曲线</span>
      <span id="currentKeyBadge" class="target-pill">当前主音：C3</span>
    </div>

    <div class="pitch-readout-row">
      <div class="note-box">
        <span id="detectedNote" class="detected-note">--</span>
        <span id="centsText" class="cents-label">等待人声输入...</span>
      </div>
      <div id="targetNoteBadge" class="target-pill">目标音：--</div>
    </div>

    <div class="cents-meter">
      <div class="cents-center-zone"></div>
      <div id="centsNeedle" class="cents-needle"></div>
    </div>

    <canvas id="pitchCanvas" class="pitch-canvas" width="600" height="160"></canvas>
  </div>

  <!-- 男女声一键切换 & 音域设定 -->
  <div class="card">
    <div class="card-header">
      <span id="voiceCardTitle" class="card-title">声部音域一键切换</span>
      <span id="rangeSummary" class="card-sub">男声主唱 (A2 – G4)</span>
    </div>

    <div class="voice-switch-grid">
      <button id="maleVoiceBtn" class="voice-btn active-male" type="button">
        <span>男声模式 (Male)</span>
        <small>默认 A2 – G4</small>
      </button>
      <button id="femaleVoiceBtn" class="voice-btn" type="button">
        <span>女声模式 (Female)</span>
        <small>默认 F3 – D5</small>
      </button>
    </div>

    <div class="mini-grid-3">
      <div class="mini-field">
        <label id="startNoteLabel" for="startNoteSelect">起始主音</label>
        <select id="startNoteSelect"></select>
      </div>
      <div class="mini-field">
        <label id="highNoteLabel" for="highNoteSelect">爬升最高音</label>
        <select id="highNoteSelect"></select>
      </div>
      <div class="mini-field">
        <label id="dirModeLabel" for="dirModeSelect">移调方向</label>
        <select id="dirModeSelect">
          <option value="pyramid">升顶再回落</option>
          <option value="up">单向升半音</option>
          <option value="lock">锁定当前调</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 风格练声模进选择 -->
  <div class="card">
    <div class="card-header">
      <span id="styleCardTitle" class="card-title">日系风格旋律练声模进</span>
      <span id="chordHintBadge" class="card-sub">铺底和弦：Maj9</span>
    </div>

    <div id="genreGroup" class="pill-group" style="margin-bottom: 10px;">
      <button class="pill-btn active" data-genre="all" type="button">全部</button>
      <button class="pill-btn jpop" data-genre="jpop" type="button">J-Pop</button>
      <button class="pill-btn jrock" data-genre="jrock" type="button">J-Rock</button>
      <button class="pill-btn jjazz" data-genre="jjazz" type="button">J-Jazz</button>
      <button class="pill-btn" data-genre="basic" type="button">基础热身</button>
    </div>

    <div class="mini-field">
      <label id="patternSelectLabel" for="patternSelect">选择练声句型（自动移调 + 和弦伴奏）</label>
      <select id="patternSelect"></select>
    </div>

    <div id="notesStrip" class="notes-strip"></div>
    <div id="patternDesc" class="pattern-desc"></div>
  </div>

  <!-- 速度与音色设置 -->
  <div class="card">
    <div class="card-header" style="margin-bottom: 4px;">
      <span id="tempoCardTitle" class="card-title">旋律速度 &amp; 伴奏音色</span>
      <span id="bpmLabel" class="card-sub">96 BPM</span>
    </div>
    <div class="bpm-row">
      <button id="bpmMinusBtn" class="step-btn" type="button">-</button>
      <input id="bpmSlider" type="range" min="55" max="160" value="96" />
      <button id="bpmPlusBtn" class="step-btn" type="button">+</button>
    </div>

    <div class="mini-grid-2" style="margin-top: 10px;">
      <div class="mini-field">
        <label id="toneLabel" for="toneSelect">钢琴/合成器音色</label>
        <select id="toneSelect">
          <option value="epiano">柔和电钢 (E-Piano)</option>
          <option value="warmpad">温暖垫音 (Warm Pad)</option>
          <option value="pure">纯净正弦 (Pure Sine)</option>
        </select>
      </div>
      <div class="mini-field">
        <label id="chordPadLabel" for="chordPadSelect">伴奏和弦铺底</label>
        <select id="chordPadSelect">
          <option value="on">开启（每条自动配和弦）</option>
          <option value="off">关闭（仅单音旋律）</option>
        </select>
      </div>
    </div>
  </div>

  <div class="dock-bar">
    <button id="keyDownBtn" class="shift-btn" type="button">-1 半音</button>
    <button id="playBtn" class="play-btn" type="button">开始练声</button>
    <button id="keyUpBtn" class="shift-btn" type="button">+1 半音</button>
  </div>

  <script>
    const STORAGE_KEY = "vocalbuddy_v1_1_settings";
    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function midiToNoteName(midi) {
      const name = NOTE_NAMES[((midi % 12) + 12) % 12];
      const octave = Math.floor(midi / 12) - 1;
      return `${name}${octave}`;
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function freqToMidiFloat(freq) {
      return 69 + 12 * Math.log2(freq / 440);
    }

    function saveSettings() {

    function loadSettings() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        Object.keys(defaultState).forEach((k) => {
          if (parsed[k] !== undefined) state[k] = parsed[k];

        state.currentRootMidi = state.startMidi;

    let audioCtx = null;

    let iosUnlocked = false;

    function createSilentWavDataUrl() {
      const sampleRate = 8000;
      const numSamples = 800;
      const buffer = new ArrayBuffer(44 + numSamples * 2);
      const view = new DataView(buffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF");
      view.setUint32(4, 36 + numSamples * 2, true);
      writeStr(8, "WAVE");
      writeStr(12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, "data");
      view.setUint32(40, numSamples * 2, true);
      const bytes = new Uint8Array(buffer);
      let bin = "";
      for (let i = 0; i < bytes.byteLength; i++) bin += String.fromCharCode(bytes[i]);
      return "data:audio/wav;base64," + btoa(bin);
    }

    function unlockIOSSilentSwitch() {
      try {
        if (!silentHtmlAudio) {
          silentHtmlAudio = new Audio(createSilentWavDataUrl());
          silentHtmlAudio.setAttribute("playsinline", "");
        }
        if (!iosUnlocked || silentHtmlAudio.paused) {
          const p = silentHtmlAudio.play();
          if (p && p.then) p.then(() => { iosUnlocked = true; }).catch(() => {});
        }
      } catch (e) {}
    }

    async function ensureAudio() {
      unlockIOSSilentSwitch();
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended" || audioCtx.state === "interrupted") {
        try { await audioCtx.resume(); } catch (e) {}
      }
    }

    // 合成器音色发声
    function playSynthNote(midi, durationSec, volume = 0.24) {
      if (!audioCtx || audioCtx.state !== "running") return;
      const now = audioCtx.currentTime;
      const freq = midiToFreq(midi);

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      if (state.tone === "epiano") {
        osc.type = "triangle";
        const overtone = audioCtx.createOscillator();
        const overGain = audioCtx.createGain();
        overtone.type = "sine";
        overtone.frequency.setValueAtTime(freq * 2, now);
        overGain.gain.setValueAtTime(volume * 0.25, now);
        overGain.gain.exponentialRampToValueAtTime(0.001, now + Math.min(0.25, durationSec));
        overtone.connect(overGain);
        overGain.connect(audioCtx.destination);
        overtone.start(now);
        overtone.stop(now + durationSec + 0.05);
      } else if (state.tone === "warmpad") {
        osc.type = "sawtooth";
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(900, now);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(volume * 0.7, now + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec + 0.12);
        osc.start(now);
        osc.stop(now + durationSec + 0.15);
        return;
      } else {
        osc.type = "sine";
      }

      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(volume, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec + 0.08);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + durationSec + 0.1);
    }

    function playBackingChord(rootMidi, intervals, durationSec) {
      if (state.chordPad !== "on" || !audioCtx || audioCtx.state !== "running") return;
      const now = audioCtx.currentTime;
      intervals.forEach((semi) => {
        const osc = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(midiToFreq(rootMidi + semi), now);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(750, now);

        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.048, now + 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + durationSec);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + durationSec + 0.05);
      });
    }

    // 练声旋律步进调度
    async function startSingingLoop() {
      await ensureAudio();
      state.isPlaying = true;
      state.currentStepIdx = 0;
      updateUI();
      runPatternStep();
    }

    function stopSingingLoop() {
      state.isPlaying = false;
      clearTimeout(state.stepTimer);
      state.currentStepIdx = -1;
      state.activeTargetMidi = null;
      document.getElementById("targetNoteBadge").textContent = t().targetNote("--");
      renderPatternStrip();
      updateUI();
    }

    function advanceKeyAfterPattern() {
      if (state.dirMode === "lock") return;
      const pat = getSelectedPattern();
      const maxSemi = Math.max(...pat.steps.map((s) => s.semi));
      const topAllowedRoot = Math.max(state.startMidi, state.highMidi - maxSemi);

      if (state.dirMode === "up") {
        if (state.currentRootMidi < topAllowedRoot) {
          state.currentRootMidi++;
        } else {
          state.currentRootMidi = state.startMidi;
        }
      } else if (state.dirMode === "pyramid") {
        if (state.climbDir === 1) {
          if (state.currentRootMidi < topAllowedRoot) {
            state.currentRootMidi++;
          } else {
            state.climbDir = -1;
            if (state.currentRootMidi > state.startMidi) state.currentRootMidi--;
          }
        } else {
          if (state.currentRootMidi > state.startMidi) {
            state.currentRootMidi--;
          } else {
            state.climbDir = 1;
            if (state.currentRootMidi < topAllowedRoot) state.currentRootMidi++;
          }
        }
      }
      renderPatternStrip();
    }

    function runPatternStep() {
      if (!state.isPlaying) return;
      const pat = getSelectedPattern();
      const beatSec = 60 / state.bpm;

      // 每条练声句开头先铺底和弦
      if (state.currentStepIdx === 0) {
        const totalBeats = pat.steps.reduce((acc, s) => acc + s.dur, 0);
        playBackingChord(state.currentRootMidi, pat.chordIntervals, totalBeats * beatSec);
      }

      const step = pat.steps[state.currentStepIdx];
      const targetMidi = state.currentRootMidi + step.semi;
      const durSec = step.dur * beatSec;

      state.activeTargetMidi = targetMidi;
      document.getElementById("targetNoteBadge").textContent = t().targetNote(midiToNoteName(targetMidi));
      playSynthNote(targetMidi, durSec * 0.9, 0.26);

      document.querySelectorAll("#notesStrip .note-step").forEach((el, idx) => {
        el.classList.toggle("active", idx === state.currentStepIdx);
      });

      state.stepTimer = setTimeout(() => {
        if (!state.isPlaying) return;
        state.currentStepIdx++;
        if (state.currentStepIdx >= pat.steps.length) {
          state.currentStepIdx = 0;
          advanceKeyAfterPattern();
          // 条与条之间留半拍换气时间
          state.stepTimer = setTimeout(runPatternStep, beatSec * 500);
        } else {
          runPatternStep();
        }
      }, durSec * 1000);
    }

    // ================= 麦克风实时音高探测 (Autocorrelation) =================
    async function enableMicrophone() {
      try {
        await ensureAudio();
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: false
          }
        });
        state.micStream = stream;
        const source = audioCtx.createMediaStreamSource(stream);
        state.analyser = audioCtx.createAnalyser();
        state.analyser.fftSize = 2048;
        state.micBuffer = new Float32Array(state.analyser.fftSize);
        source.connect(state.analyser);
        state.micEnabled = true;
        updateUI();
      } catch (err) {
        state.micEnabled = false;
        const micBtn = document.getElementById("micToggleBtn");
        micBtn.textContent = t().micDenied;
        micBtn.className = "chip-btn mic-off";
      }
    }

    function disableMicrophone() {
      if (state.micStream) {
        state.micStream.getTracks().forEach((tr) => tr.stop());
        state.micStream = null;
      }
      state.analyser = null;
      state.micEnabled = false;
      document.getElementById("detectedNote").textContent = "--";
      document.getElementById("detectedNote").classList.remove("in-tune");
      document.getElementById("centsText").textContent = t().micMutedHint;
      document.getElementById("centsNeedle").style.left = "50%";
      updateUI();
    }

    function autoCorrelate(buf, sampleRate) {
      let rms = 0;
      for (let i = 0; i < buf.length; i++) {
        rms += buf[i] * buf[i];
      }
      rms = Math.sqrt(rms / buf.length);
      if (rms < 0.012) return -1; // 静音阈值

      let r1 = 0, r2 = buf.length - 1;
      const thres = 0.2;
      for (let i = 0; i < buf.length / 2; i++) {
        if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      }
      for (let i = 1; i < buf.length / 2; i++) {
        if (Math.abs(buf[buf.length - i]) < thres) { r2 = buf.length - i; break; }
      }

      const trimmed = buf.slice(r1, r2);
      const size = trimmed.length;
      const c = new Float32Array(size);
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size - i; j++) {
          c[i] += trimmed[j] * trimmed[j + i];
        }
      }

      let d = 0;
      while (d < size - 1 && c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < size; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }

      let T0 = maxpos;
      if (T0 <= 0 || T0 >= size - 1) return -1;
      const x1 = c[T0 - 1], x2 = c[T0], x3 = c[T0 + 1];
      const a = (x1 + x3 - 2 * x2) / 2;
      const b = (x3 - x1) / 2;
      if (a) T0 = T0 - b / (2 * a);

      const freq = sampleRate / T0;
      if (freq < 65 || freq > 1100) return -1; // 人声合理范围 C2-C6
      return freq;
    }

    const canvas = document.getElementById("pitchCanvas");
    const ctx2d = canvas.getContext("2d");

    function pitchLoop() {
      let detectedMidiFloat = null;

      if (state.micEnabled && state.analyser && audioCtx) {
        state.analyser.getFloatTimeDomainData(state.micBuffer);
        const freq = autoCorrelate(state.micBuffer, audioCtx.sampleRate);
        const noteEl = document.getElementById("detectedNote");
        const centsEl = document.getElementById("centsText");
        const needle = document.getElementById("centsNeedle");

        if (freq > 0) {
          detectedMidiFloat = freqToMidiFloat(freq);
          const nearestMidi = Math.round(detectedMidiFloat);
          const cents = Math.round((detectedMidiFloat - nearestMidi) * 100);
          const inTune = Math.abs(cents) <= 12;

          noteEl.textContent = midiToNoteName(nearestMidi);
          noteEl.classList.toggle("in-tune", inTune);

          if (inTune) {
            centsEl.textContent = t().centsInTune(cents);
            needle.style.background = "#22c55e";
          } else if (cents > 0) {
            centsEl.textContent = t().centsSharp(cents);
            needle.style.background = "#f59e0b";
          } else {
            centsEl.textContent = t().centsFlat(cents);
            needle.style.background = "#38bdf8";
          }

          const pct = Math.max(4, Math.min(96, 50 + cents));
          needle.style.left = `${pct}%`;
        } else {
          noteEl.textContent = "--";
          noteEl.classList.remove("in-tune");
          centsEl.textContent = t().waitingVoice;
          needle.style.left = "50%";
          needle.style.background = "#8f9bb3";
        }
      }

      // 记录历史点并绘制音高轨迹
      state.pitchHistory.push({
        detected: detectedMidiFloat,
        target: state.activeTargetMidi
      });
      if (state.pitchHistory.length > 180) {
        state.pitchHistory.shift();
      }

      drawPitchCanvas();
      requestAnimationFrame(pitchLoop);
    }

    function drawPitchCanvas() {
      const w = canvas.width;
      const h = canvas.height;
      ctx2d.clearRect(0, 0, w, h);

      // 计算动态纵轴音域视野（覆盖当前练声条音域上下各扩 3 个半音）
      const pat = getSelectedPattern();
      const maxSemi = Math.max(...pat.steps.map((s) => s.semi));
      const minViewMidi = state.currentRootMidi - 3;
      const maxViewMidi = state.currentRootMidi + maxSemi + 3;
      const span = Math.max(12, maxViewMidi - minViewMidi);

      const midiToY = (m) => {
        const norm = (m - minViewMidi) / span;
        return h - 14 - norm * (h - 28);
      };

      // 水平参考网格线
      ctx2d.strokeStyle = "rgba(255,255,255,0.06)";
      ctx2d.lineWidth = 1;
      for (let m = Math.ceil(minViewMidi); m <= Math.floor(maxViewMidi); m++) {
        const y = midiToY(m);
        ctx2d.beginPath();
        ctx2d.moveTo(0, y);
        ctx2d.lineTo(w, y);
        ctx2d.stroke();
      }

      const len = state.pitchHistory.length;
      if (len < 2) return;
      const stepX = w / 180;

      // 1. 绘制目标音高基准线（紫色虚线）
      ctx2d.strokeStyle = "rgba(167, 139, 250, 0.85)";
      ctx2d.lineWidth = 3;
      ctx2d.beginPath();
      let startedTarget = false;
      for (let i = 0; i < len; i++) {
        const pt = state.pitchHistory[i];
        if (pt.target !== null) {
          const x = i * stepX;
          const y = midiToY(pt.target);
          if (!startedTarget) { ctx2d.moveTo(x, y); startedTarget = true; }
          else ctx2d.lineTo(x, y);
        } else {
          startedTarget = false;
        }
      }
      ctx2d.stroke();

      // 2. 绘制人声实时音高曲线（青绿色亮线）
      ctx2d.strokeStyle = "#38bdf8";
      ctx2d.lineWidth = 3.5;
      ctx2d.lineCap = "round";
      ctx2d.beginPath();
      let startedVoice = false;
      for (let i = 0; i < len; i++) {
        const pt = state.pitchHistory[i];
        if (pt.detected !== null) {
          const x = i * stepX;
          const y = midiToY(pt.detected);
          if (!startedVoice) { ctx2d.moveTo(x, y); startedVoice = true; }
          else ctx2d.lineTo(x, y);
        } else {
          startedVoice = false;
        }
      }
      ctx2d.stroke();
    }

    // ================= 事件绑定 =================
    document.getElementById("langBtn").addEventListener("click", () => {
      state.lang = state.lang === "zh" ? "en" : "zh";
      saveSettings();
      updateUI();
    });

    document.getElementById("micToggleBtn").addEventListener("click", () => {
      if (state.micEnabled) disableMicrophone();
      else enableMicrophone();
    });

    document.getElementById("maleVoiceBtn").addEventListener("click", () => {
      state.voiceType = "male";
      state.startMidi = 45; // A2
      state.highMidi = 67;  // G4
      state.currentRootMidi = 45;
      state.climbDir = 1;
      saveSettings();
      updateUI();
    });

    document.getElementById("femaleVoiceBtn").addEventListener("click", () => {
      state.voiceType = "female";
      state.startMidi = 53; // F3
      state.highMidi = 74;  // D5
      state.currentRootMidi = 53;
      state.climbDir = 1;
      saveSettings();
      updateUI();
    });

    startNoteSelect.addEventListener("change", () => {
      state.startMidi = Number(startNoteSelect.value);
      if (state.highMidi < state.startMidi) state.highMidi = state.startMidi;
      state.currentRootMidi = state.startMidi;
      saveSettings();
      updateUI();
    });

    highNoteSelect.addEventListener("change", () => {
      state.highMidi = Number(highNoteSelect.value);
      if (state.highMidi < state.startMidi) state.startMidi = state.highMidi;
      saveSettings();
      updateUI();
    });

    document.getElementById("dirModeSelect").addEventListener("change", (e) => {
      state.dirMode = e.target.value;
      saveSettings();
    });

    document.getElementById("genreGroup").addEventListener("click", (e) => {
      const btn = e.target.closest(".pill-btn");
      if (!btn) return;
      state.genreFilter = btn.dataset.genre;
      saveSettings();
      updateUI();
    });

    document.getElementById("patternSelect").addEventListener("change", (e) => {
      state.patternId = e.target.value;
      state.currentStepIdx = 0;
      saveSettings();
      renderPatternStrip();
    });

    document.getElementById("bpmSlider").addEventListener("input", (e) => {
      state.bpm = Number(e.target.value);
      document.getElementById("bpmLabel").textContent = `${state.bpm} BPM`;
      saveSettings();
    });

    document.getElementById("bpmMinusBtn").addEventListener("click", () => {
      state.bpm = Math.max(55, state.bpm - 2);
      saveSettings();
      updateUI();
    });

    document.getElementById("bpmPlusBtn").addEventListener("click", () => {
      state.bpm = Math.min(160, state.bpm + 2);
      saveSettings();
      updateUI();
    });

    document.getElementById("toneSelect").addEventListener("change", (e) => {
      state.tone = e.target.value;
      saveSettings();
    });

    document.getElementById("chordPadSelect").addEventListener("change", (e) => {
      state.chordPad = e.target.value;
      saveSettings();
    });

    document.getElementById("keyDownBtn").addEventListener("click", async () => {
      await ensureAudio();
      state.currentRootMidi = Math.max(36, state.currentRootMidi - 1);
      renderPatternStrip();
      if (!state.isPlaying) playSynthNote(state.currentRootMidi, 0.45, 0.25);
    });

    document.getElementById("keyUpBtn").addEventListener("click", async () => {
      await ensureAudio();
      state.currentRootMidi = Math.min(84, state.currentRootMidi + 1);
      renderPatternStrip();
      if (!state.isPlaying) playSynthNote(state.currentRootMidi, 0.45, 0.25);
    });

    document.getElementById("playBtn").addEventListener("click", () => {
      if (state.isPlaying) stopSingingLoop();
      else startSingingLoop();
    });

    // 启动初始化：渲染界面 + 立即尝试请求麦克风 + 启动音高绘制循环
    updateUI();
    enableMicrophone();
    requestAnimationFrame(pitchLoop);

    // 若 iOS Safari 拦截非手势加载时的麦克风请求，则在用户首次点击任意处时自动补一次请求
    let autoMicTriedOnGesture = false;
    ["touchstart", "pointerdown", "click"].forEach((evt) => {
      document.addEventListener(evt, function onFirstGesture(e) {
        if (e.target && e.target.id === "micToggleBtn") return;
        if (!state.micEnabled && !autoMicTriedOnGesture) {
          autoMicTriedOnGesture = true;
          enableMicrophone();
        }
        document.removeEventListener(evt, onFirstGesture, true);
      }, { capture: true, passive: true });
    });
  </script>
</body>
</html>
