<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music-Stuff — Band Training Tools</title>
  <style>
    :root {
      --bg: #0b0e14;
      --card: #141923;
      --card-hover: #1b2230;
      --border: #2a3346;
      --text: #eef2ff;
      --muted: #8f9bb3;
      --accent: #38bdf8;
      --green: #22c55e;
      --orange: #fb923c;
      --purple: #a78bfa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px 48px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
      max-width: 680px;
      margin-inline: auto;
    }

    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }

    .subtitle {
      margin: 4px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .controls {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #061018;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .tool-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 15px 16px;
      border-radius: 14px;
      background: var(--card);
      border: 1px solid var(--border);
      text-decoration: none;
      color: var(--text);
      transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
    }

    .tool-card:hover {
      background: var(--card-hover);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .tool-card.latest {
      border-color: rgba(56, 189, 248, 0.45);
    }

    .tool-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      border-radius: 11px;
      background: #1b2230;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .tool-info { min-width: 0; }

    .tool-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tool-name {
      font-size: 15px;
      font-weight: 800;
      word-break: break-all;
    }

    .badge {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .badge-latest {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.35);
    }

    .badge-ver {
      background: rgba(167, 139, 250, 0.16);
      color: #c4b5fd;
      border: 1px solid rgba(167, 139, 250, 0.35);
    }

    .tool-desc {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .arrow {
      color: var(--muted);
      font-size: 16px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .status-box {
      padding: 24px;
      text-align: center;
      border-radius: 14px;
      background: var(--card);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Music-Stuff</h1>
      <p class="subtitle">Auto-indexed Band Practice &amp; Groove Trainers</p>
    </div>
    <button id="toggleOldBtn" class="filter-btn active" type="button">Only Latest Versions</button>
  </header>

  <div id="statusBox" class="status-box">Loading tools from GitHub main branch...</div>
  <div id="toolsGrid" class="grid"></div>

  <script>
    const OWNER = "JupitrisPotato";
    const REPO = "Music-Stuff";
    const BRANCH = "main";

    let allTools = [];
    let onlyLatest = true;

    function parseToolMeta(filename) {
      const lower = filename.toLowerCase();
      let icon = "🎵";
      let category = "Music Tool";
      let family = filename.replace(/\.html$/i, "");

      if (lower.includes("keys")) {
        icon = "🎹";
        category = "Keyboard & Synth Voicing Trainer";
        family = "keysbuddy";
      } else if (lower.includes("drill")) {
        icon = "🎸";
        category = "Bass & Guitar Fretboard Trainer";
        family = "drillbuddy";
      } else if (lower.includes("drum")) {
        icon = "🥁";
        category = "Drummer Rhythm & Rudiment Trainer";
        family = "drumsbuddy";
      }

      const verMatch = filename.match(/v(\d+(?:\.\d+)*)/i);
      const versionStr = verMatch ? `v${verMatch[1]}` : "v1";
      const versionParts = verMatch
        ? verMatch[1].split(".").map(Number)
        : [1];

      return {
        filename,
        icon,
        category,
        family,
        versionStr,
        versionParts,
        isLatest: false
      };
    }

    function compareVersions(a, b) {
      const len = Math.max(a.length, b.length);
      for (let i = 0; i < len; i++) {
        const numA = a[i] || 0;
        const numB = b[i] || 0;
        if (numA !== numB) return numB - numA;
      }
      return 0;
    }

    function renderTools() {
      const grid = document.getElementById("toolsGrid");
      grid.innerHTML = "";

      const visible = onlyLatest
        ? allTools.filter((item) => item.isLatest)
        : allTools;

      visible.forEach((tool) => {
        const card = document.createElement("a");
        card.className = `tool-card ${tool.isLatest ? "latest" : ""}`;
        card.href = `./${encodeURIComponent(tool.filename)}`;

        card.innerHTML = `
          <div class="tool-left">
            <div class="icon-box">${tool.icon}</div>
            <div class="tool-info">
              <div class="tool-title-row">
                <span class="tool-name">${tool.filename.replace(/\.html$/i, "")}</span>
                <span class="badge badge-ver">${tool.versionStr}</span>
                ${tool.isLatest ? `<span class="badge badge-latest">Latest</span>` : ""}
              </div>
              <div class="tool-desc">${tool.category}</div>
            </div>
          </div>
          <div class="arrow">→</div>
        `;
        grid.appendChild(card);
      });
    }

    async function fetchRepoFiles() {
      const statusBox = document.getElementById("statusBox");
      try {
        const apiUrl = `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;
        const res = await fetch(apiUrl, {
          headers: { "Accept": "application/vnd.github.v3+json" }
        });

        if (!res.ok) throw new Error(`GitHub API HTTP ${res.status}`);
        const files = await res.json();

        const htmlFiles = files
          .filter((f) => f.type === "file" && /\.html$/i.test(f.name) && f.name.toLowerCase() !== "index.html")
          .map((f) => parseToolMeta(f.name));

        // 按系列分组并找出每个系列的最高版本
        const families = {};
        htmlFiles.forEach((item) => {
          if (!families[item.family]) families[item.family] = [];
          families[item.family].push(item);
        });

        Object.values(families).forEach((group) => {
          group.sort((a, b) => compareVersions(a.versionParts, b.versionParts));
          if (group.length > 0) group[0].isLatest = true;
        });

        // 最新版置顶，其余按名称与版本降序
        htmlFiles.sort((a, b) => {
          if (a.isLatest !== b.isLatest) return a.isLatest ? -1 : 1;
          if (a.family !== b.family) return a.family.localeCompare(b.family);
          return compareVersions(a.versionParts, b.versionParts);
        });

        allTools = htmlFiles;
        statusBox.style.display = "none";
        renderTools();
      } catch (err) {
        statusBox.textContent = `Failed to load file list automatically (${err.message}). Please refresh.`;
      }
    }

    document.getElementById("toggleOldBtn").addEventListener("click", (e) => {
      onlyLatest = !onlyLatest;
      e.target.textContent = onlyLatest ? "Only Latest Versions" : "Show All Versions";
      e.target.classList.toggle("active", onlyLatest);
      renderTools();
    });

    fetchRepoFiles();
  </script>
</body>
</html>
